name: BOD remote Nitro lab

on:
  push:
    branches:
      - experiment/hf-nitro-self-hosting-2026-10-07
  workflow_dispatch:

concurrency:
  group: bod-remote-nitro-lab
  cancel-in-progress: true

jobs:
  nitro-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BOD
        uses: actions/checkout@v4

      - name: Validate public surface
        run: python3 scripts/validate_public_surface.py

      - name: Bootstrap pinned Nitro testnode
        timeout-minutes: 20
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=60s 18m             bash tools/remote/bootstrap_nitro_testnode.sh             2>&1 | tee "$RUNNER_TEMP/bod-nitro-bootstrap.log"

      - name: Diagnose Nitro bootstrap failure
        if: failure()
        run: |
          echo "=== docker containers ==="
          docker ps -a || true
          echo "=== docker compose/process summary ==="
          docker info 2>/dev/null | sed -n '1,80p' || true
          echo "=== bootstrap log tail ==="
          if [ -f "$RUNNER_TEMP/bod-nitro-bootstrap.log" ]; then
            tail -n 120 "$RUNNER_TEMP/bod-nitro-bootstrap.log"
          fi

      - name: Run BOD deterministic regression
        run: |
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          PYTHONPATH=. pytest -q
