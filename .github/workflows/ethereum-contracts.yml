name: Ethereum contracts

on:
  push:
    branches: ["main"]
    paths:
      - "protocol/ethereum/**"
      - "test/**"
      - "foundry.toml"
      - "tools/eas/**"
      - "package.json"
      - ".github/workflows/ethereum-contracts.yml"
  pull_request:
    paths:
      - "protocol/ethereum/**"
      - "test/**"
      - "foundry.toml"
      - "tools/eas/**"
      - "package.json"
      - ".github/workflows/ethereum-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run Solidity tests
        run: forge test -vvv

  eas-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned EAS SDK dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Check EAS integration scripts
        run: |
          node --check tools/eas/schema.mjs
          node --check tools/eas/register-schema.mjs
          node --check tools/eas/attest-checkpoint.mjs
          node --input-type=module -e "import { BOD_EAS_SCHEMA, EAS_DEPLOYMENTS } from './tools/eas/schema.mjs'; if (!BOD_EAS_SCHEMA.includes('bytes32 checkpointId') || EAS_DEPLOYMENTS[11155111].eas.length !== 42) process.exit(1)"
