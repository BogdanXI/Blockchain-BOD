name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test,lint]"
      - name: Validate public repository surface
        run: python scripts/validate_public_surface.py
      - name: Run static analysis
        run: ruff check --select E4,E7,E9,F src scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Run installed CLI smoke test
        run: bod demo
      - name: Check installed dependencies
        run: python -m pip check

  foundry:
    name: Ethereum Solidity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.9.0
      - name: Run Solidity tests
        run: forge test -vvv

  eas-sdk:
    name: Ethereum Attestation Service tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install pinned EAS SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check EAS integration scripts
        run: |
          node --check tools/eas/schema.mjs
          node --check tools/eas/register-schema.mjs
          node --check tools/eas/attest-checkpoint.mjs
          node --input-type=module -e "import { BOD_EAS_SCHEMA, EAS_DEPLOYMENTS } from './tools/eas/schema.mjs'; if (!BOD_EAS_SCHEMA.includes('bytes32 checkpointId') || EAS_DEPLOYMENTS[11155111].eas.length !== 42) process.exit(1)"
