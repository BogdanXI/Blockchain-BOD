name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Audit Python dependencies
        run: pip-audit --skip-editable
      - name: Generate Python dependency SBOM
        if: matrix.python-version == '3.13'
        run: pip-audit --skip-editable --format cyclonedx-json -o sbom-python.cdx.json
      - name: Upload Python dependency SBOM
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate public repository surface
        run: python scripts/validate_public_surface.py
      - name: Run static analysis
        run: ruff check --select E4,E7,E9,F src scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Run installed CLI smoke test
        run: bod demo
      - name: Check installed dependencies
        run: python -m pip check

  foundry:
    name: Ethereum Solidity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.9.0
      - name: Run Solidity tests
        run: forge test -vvv

  eas-sdk:
    name: Ethereum Attestation Service tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install pinned EAS SDK dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Generate npm dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json
      - name: Upload npm dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-npm
          path: sbom-node.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Check EAS integration scripts
        run: |
          node --check tools/eas/schema.mjs
          node --check tools/eas/register-schema.mjs
          node --check tools/eas/attest-checkpoint.mjs
          node tools/eas/smoke-test.mjs
          node --input-type=module -e "import { BOD_EAS_SCHEMA, EAS_DEPLOYMENTS } from './tools/eas/schema.mjs'; if (!BOD_EAS_SCHEMA.includes('bytes32 checkpointId') || EAS_DEPLOYMENTS[11155111].eas.length !== 42) process.exit(1)"
