name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Audit Python dependencies
        run: pip-audit --skip-editable
      - name: Generate Python dependency SBOM
        if: matrix.python-version == '3.13'
        run: pip-audit --skip-editable --format cyclonedx-json -o sbom-python.cdx.json
      - name: Attest Python SBOM provenance
        if: matrix.python-version == '3.13' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom-python.cdx.json
      - name: Verify Python SBOM provenance
        if: matrix.python-version == '3.13' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify sbom-python.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: Upload Python dependency SBOM
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate public repository surface
        run: python scripts/validate_public_surface.py
      - name: Run static analysis
        run: ruff check --select E4,E7,E9,F src scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Run installed CLI smoke test
        run: bod demo
      - name: Check installed dependencies
        run: python -m pip check

  foundry:
    name: Ethereum Solidity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.9.0
      - name: Run Solidity tests
        run: forge test -vvv

  eas-sdk:
    name: Ethereum Attestation Service tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install pinned EAS SDK dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Generate npm dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json
      - name: Attest npm SBOM provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom-node.cdx.json
      - name: Verify npm SBOM provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify sbom-node.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: Upload npm dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-npm
          path: sbom-node.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Check EAS integration scripts
        run: |
          node --check tools/eas/schema.mjs
          node --check tools/eas/register-schema.mjs
          node --check tools/eas/attest-checkpoint.mjs
          node tools/eas/smoke-test.mjs
          node --input-type=module -e "import { BOD_EAS_SCHEMA, EAS_DEPLOYMENTS } from './tools/eas/schema.mjs'; if (!BOD_EAS_SCHEMA.includes('bytes32 checkpointId') || EAS_DEPLOYMENTS[11155111].eas.length !== 42) process.exit(1)"
