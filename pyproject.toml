[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-bod"
version = "0.1.0"
description = "BOD Evidence Fabric: deterministic evidence, lineage and external anchoring for software state"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "BogdanXI"}]
license = {file = "LICENSE"}
keywords = ["provenance", "evidence", "integrity", "software-supply-chain", "blockchain"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
bod = "bod_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bod_cli", "bod_evidence_envelope", "bod_portable", "bod_anchor", "bod_verify_simple"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "-q"
