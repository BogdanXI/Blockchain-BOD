[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-bod"
version = "0.1.0"
description = "Portable, independently verifiable continuity for software release evidence, with optional Ethereum witnesses"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "BogdanXI"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ethereum", "provenance", "evidence", "integrity", "software-supply-chain", "attestations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "PyYAML>=6.0,<7",
]
lint = [
    "ruff==0.17.6",
]

[project.scripts]
bod = "bod_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bod_cli", "bod_evidence_envelope", "bod_portable", "bod_evidence_formats", "bod_anchor", "bod_verify_simple", "bod_ethereum_release_profile"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "-q"
